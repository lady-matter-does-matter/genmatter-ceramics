<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact · GENEVIEVE MATTER</title>
    <style>
      :root {
        --bg: #f4f4f5;
        --text: #777777;
        --accent: #93232a;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: var(--bg);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: var(--text);
      }

      .page {
        width: 100vw;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 3.5rem 4rem 3rem 3.5rem;
      }

      .title {
        margin-top: 0.4rem;
        font-size: clamp(2.4rem, 4vw, 3.4rem);
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: var(--accent);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="title">CONTACT</div>
    </div>
  </body>
</html>
