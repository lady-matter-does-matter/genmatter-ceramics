<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GENEVIEVE MATTER · creation matters</title>
    <style>
      :root {
        --bg: #f4f4f5;
        --text: #777777;
        --accent: #93232a;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: var(--bg);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: var(--text);
      }

      .page {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
        padding: 3.5rem 4rem 0 3.5rem;
      }

      .hero {
        display: flex;
        align-items: flex-start;
        gap: 3rem;
        width: 100%;
      }

      .mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }

      .logo {
        width: 64px;
        height: 64px;
      }

      .logo svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .logo path {
        fill: none;
        stroke: var(--accent);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .mark-text {
        font-size: 0.7rem;
        line-height: 1.6;
        text-transform: lowercase;
        letter-spacing: 0.08em;
      }

      .name {
        margin-top: 0.75rem;
        font-size: clamp(2.4rem, 4vw, 3.4rem);
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: var(--accent);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div class="mark">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <path
                d="M32 10
                   C26 10 22 16 22 22
                   C22 28 26 32 32 34
                   C38 32 42 28 42 22
                   C42 16 38 10 32 10Z"
              />
              <path
                d="M20 24
                   C16 24 14 28 14 32
                   C14 36 17 40 22 42"
              />
              <path
                d="M44 24
                   C48 24 50 28 50 32
                   C50 36 47 40 42 42"
              />
              <path d="M32 34 C30 40 26 44 20 46" />
              <path d="M32 34 C34 40 38 44 44 46" />
              <path d="M24 50 H40" />
            </svg>
          </div>
          <div class="mark-text">
            creation<br />
            matters
          </div>
        </div>
        <div class="name">GENEVIEVE MATTER</div>
      </header>
    </div>
  </body>
</html>
