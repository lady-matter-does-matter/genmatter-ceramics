<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GENEVIEVE MATTER · creation matters</title>
    <style>
      :root {
        --bg: #f4f4f5;
        --text: #777777;
        --accent: #93232a;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: var(--bg);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: var(--text);
      }

      .page {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
        padding: 3.5rem 4rem 0 3.5rem;
      }

      .hero {
        display: flex;
        align-items: flex-start;
        gap: 1.75rem;
        width: 100%;
      }

      .mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        position: relative;
      }

      .logo {
        width: 92px;
        height: 92px;
      }

      .logo img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
      }

      .mark-text {
        font-size: 0.8rem;
        line-height: 1.6;
        text-transform: lowercase;
        letter-spacing: 0.08em;
      }

      .name {
        margin-top: 0.4rem;
        font-size: clamp(2.4rem, 4vw, 3.4rem);
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: var(--accent);
        white-space: nowrap;
      }

      .hero-main {
        display: flex;
        align-items: flex-start;
      }

      .mark-menu {
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translate(-50%, 0.8rem);
        padding: 0.9rem 1.3rem;
        background-color: #f8f8f8;
        border-radius: 1rem;
        box-shadow: 0 14px 35px rgba(0, 0, 0, 0.08);
        display: none;
        font-size: 0.75rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .mark:hover .mark-menu {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .mark-menu-item {
        color: var(--text);
        white-space: nowrap;
      }

      .mark-menu-item:hover {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div class="mark">
          <div class="logo" aria-hidden="true">
            <img src="./logo.png" alt="" />
          </div>
          <div class="mark-text">
            creation<br />
            matters
          </div>
          <nav class="mark-menu" aria-label="Main navigation">
            <span class="mark-menu-item">about</span>
            <span class="mark-menu-item">ceramics</span>
            <span class="mark-menu-item">prints</span>
            <span class="mark-menu-item">contact</span>
          </nav>
        </div>
        <div class="hero-main">
          <div class="name">GENEVIEVE MATTER</div>
        </div>
      </header>
    </div>
  </body>
</html>
