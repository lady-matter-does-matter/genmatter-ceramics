<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>creation matters</title>
    <style>
      :root {
        --bg: #f4f4f5;
        --text: #7c7c7c;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: var(--bg);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: var(--text);
      }

      .page {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
        padding: 3.5rem 0 0 3.5rem;
      }

      .title {
        letter-spacing: 0.25em;
        font-size: 0.9rem;
        line-height: 1.6;
        text-transform: lowercase;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="title">
        creation<br />
        matters
      </div>
    </div>
  </body>
</html>
