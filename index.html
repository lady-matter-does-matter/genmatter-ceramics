<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GENEVIEVE MATTER · creation matters</title>
    <style>
      :root {
        --bg: #f4f4f5;
        --text: #777777;
        --accent: #93232a;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: var(--bg);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: var(--text);
      }

      .page {
        width: 100vw;
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
        flex-direction: column;
        padding: 3.5rem 4rem 3rem 3.5rem;
      }

      .hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.75rem;
        width: 100%;
      }

      .hero-left {
        display: flex;
        align-items: flex-start;
        gap: 1.75rem;
      }

      .mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        position: relative;
      }

      .logo {
        width: 92px;
        height: 92px;
      }

      .logo img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
      }

      .mark-text {
        font-size: 0.8rem;
        line-height: 1.6;
        text-transform: lowercase;
        letter-spacing: 0.08em;
      }

      .name {
        margin-top: 0.4rem;
        font-size: clamp(2.4rem, 4vw, 3.4rem);
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: var(--accent);
        white-space: nowrap;
      }

      .hero-main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .gallery {
        margin-top: 4rem;
        width: 100%;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 2.5rem;
      }

      .gallery-item {
        position: relative;
        overflow: hidden;
        border-radius: 0.75rem;
      }

      .gallery-item img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      .menu {
        position: relative;
        margin-top: 0.4rem;
        cursor: pointer;
      }

      .menu::before {
        content: "";
        position: absolute;
        top: -8px;
        right: -12px;
        left: -12px;
        bottom: -56px;
      }

      .menu-toggle {
        width: 26px;
        height: 18px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .menu-line {
        height: 2px;
        border-radius: 999px;
        background-color: var(--accent);
      }

      .menu-panel {
        position: absolute;
        top: 130%;
        right: 0;
        padding: 0.9rem 1.3rem;
        background-color: #f8f8f8;
        border-radius: 1rem;
        box-shadow: 0 14px 35px rgba(0, 0, 0, 0.08);
        display: none;
        font-size: 0.75rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .menu:hover .menu-panel {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .menu-item {
        color: var(--text);
        white-space: nowrap;
        text-decoration: none;
        display: block;
        transform-origin: left center;
        transition: transform 150ms ease-out, color 150ms ease-out;
      }

      .menu-item:hover {
        color: var(--accent);
        transform: scale(1.06);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div class="hero-left">
          <div class="mark">
            <div class="logo" aria-hidden="true">
              <img src="./logo.png" alt="" />
            </div>
            <div class="mark-text">
              creation<br />
              matters
            </div>
          </div>
          <div class="hero-main">
            <div class="name">GENEVIEVE MATTER</div>
          </div>
        </div>
        <nav class="menu" aria-label="Main navigation">
          <div class="menu-toggle" aria-hidden="true">
            <span class="menu-line"></span>
            <span class="menu-line"></span>
            <span class="menu-line"></span>
          </div>
          <div class="menu-panel">
            <a class="menu-item" href="./about.html">about</a>
            <span class="menu-item">ceramics</span>
            <span class="menu-item">prints</span>
            <span class="menu-item">contact</span>
          </div>
        </nav>
      </header>

      <section class="gallery" aria-label="Featured ceramics">
        <figure class="gallery-item">
          <img src="./images/cup-1.png" alt="Ceramic cup 1" />
        </figure>
        <figure class="gallery-item">
          <img src="./images/cup-2.png" alt="Ceramic cup 2" />
        </figure>
        <figure class="gallery-item">
          <img src="./images/cup-3.png" alt="Ceramic cup 3" />
        </figure>
        <figure class="gallery-item">
          <img src="./images/cup-4.png" alt="Ceramic cup 4" />
        </figure>
      </section>
    </div>
  </body>
</html>
