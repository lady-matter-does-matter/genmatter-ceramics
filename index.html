<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GENEVIEVE MATTER · creation matters</title>
    <style>
      :root {
        --bg: #f4f4f5;
        --text: #777777;
        --accent: #93232a;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: var(--bg);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: var(--text);
      }

      .page {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
        padding: 3.5rem 4rem 0 3.5rem;
      }

      .hero {
        display: flex;
        align-items: flex-start;
        gap: 3rem;
        width: 100%;
      }

      .mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }

      .logo {
        width: 72px;
        height: 72px;
      }

      .logo img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
      }

      .mark-text {
        font-size: 0.7rem;
        line-height: 1.6;
        text-transform: lowercase;
        letter-spacing: 0.08em;
      }

      .name {
        margin-top: 0.75rem;
        font-size: clamp(2.4rem, 4vw, 3.4rem);
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: var(--accent);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div class="mark">
          <div class="logo" aria-hidden="true">
            <img src="./logo.png" alt="" />
          </div>
          <div class="mark-text">
            creation<br />
            matters
          </div>
        </div>
        <div class="name">GENEVIEVE MATTER</div>
      </header>
    </div>
  </body>
</html>
